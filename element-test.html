<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<title>Cymatics — element harness</title>
	<style>
		body { margin: 0; background: #0b0b0d; color: #ddd; font: 13px/1.6 ui-monospace, Menlo, monospace; }
		#wrap { display: flex; gap: 16px; padding: 16px; align-items: flex-start; }
		cymatics-view { width: 640px; height: 360px; border: 1px solid #333; }
		#log { white-space: pre; }
	</style>
</head>
<body>
	<!--
		Dev-only harness (not part of the production build) for <cymatics-view>.
		A synthetic song, fed through push(), that stops for 4 s in every 12 so
		the idle swell shows. Scroll over the plate to zoom.

		  /element-test.html?look=water|mercury|lines|glow
	-->
	<div id="wrap">
		<cymatics-view id="plate"></cymatics-view>
		<div id="log"></div>
	</div>
	<script type="module">
		import { LOOKS, BINS } from './src/element/index.js'

		const el = document.getElementById('plate')
		const look = new URLSearchParams(location.search).get('look') || LOOKS[0].id
		el.look = look
		el.addEventListener('wheel', (e) => {
			e.preventDefault()
			el.zoom = Math.min(2, Math.max(0.5, el.zoom * (e.deltaY > 0 ? 0.95 : 1.05)))
		}, { passive: false })

		const spectrum = new Float32Array(BINS)
		let t = 0
		setInterval(() => {
			t += 1 / 30
			if (t % 12 > 8) return
			for (let i = 0; i < BINS; i++) {
				const f = i / BINS
				spectrum[i] = Math.min(1,
					Math.exp(-f * 60) * (0.6 + 0.4 * Math.sin(t * 3)) +
					Math.exp(-Math.pow((f - 0.08) * 25, 2)) * 0.5)
			}
			el.push(spectrum, 48000)
		}, 33)

		window.__plate = el
		document.getElementById('log').textContent =
			`look      ${look}\nsupported ${el.supported}\nlooks     ${LOOKS.map((l) => l.id).join(', ')}`
	</script>
</body>
</html>
